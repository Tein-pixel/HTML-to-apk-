name: Build TEIN APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'TEIN.zip'
      - 'TEIN_LOCAL_GRADLE_ENGINE_NDK_FIXED.zip'
      - 'TEIN_LOCAL_GRADLE_ENGINE_RECHECKED.zip'
      - 'TEIN_LOCAL_GRADLE_ENGINE_RESEARCHED.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare TEIN source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          if [[ -f extracted/TEIN/settings.gradle && -f extracted/TEIN/app/build.gradle ]]; then
            echo "Using existing extracted/TEIN source."
          else
            SOURCE_ZIP=""
            for candidate in TEIN.zip TEIN_LOCAL_GRADLE_ENGINE_NDK_FIXED.zip TEIN_LOCAL_GRADLE_ENGINE_RECHECKED.zip TEIN_LOCAL_GRADLE_ENGINE_RESEARCHED.zip; do
              if [[ -f "$candidate" ]]; then SOURCE_ZIP="$candidate"; break; fi
            done
            if [[ -z "$SOURCE_ZIP" ]]; then
              echo "::error::Upload the TEIN source ZIP to the repository root, or commit extracted/TEIN."
              exit 1
            fi
            echo "Checking $SOURCE_ZIP"
            unzip -t "$SOURCE_ZIP"
            unzip -q -o "$SOURCE_ZIP" -d extracted
          fi
          test -f extracted/TEIN/settings.gradle
          test -f extracted/TEIN/app/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Disable the action's own interactive license prompt; accept licenses
      # non-interactively in the following step instead.
      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept SDK licenses and install SDK / NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "Using SDK root: $SDK_ROOT"

          # Accept licenses without an interactive TTY. Capture sdkmanager's
          # status specifically, because `yes` may exit with SIGPIPE afterward.
          set +e
          yes | sdkmanager --sdk_root="$SDK_ROOT" --licenses > "$RUNNER_TEMP/sdk-licenses.log" 2>&1
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          cat "$RUNNER_TEMP/sdk-licenses.log"
          if [[ "$LICENSE_STATUS" -ne 0 ]]; then
            echo "::error::sdkmanager --licenses failed with exit code $LICENSE_STATUS"
            exit "$LICENSE_STATUS"
          fi

          sdkmanager --sdk_root="$SDK_ROOT" --install \
            "platforms;android-33" \
            "build-tools;34.0.0" \
            "ndk;28.2.13676358"

          NDK_CLANG="$SDK_ROOT/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if [[ ! -x "$NDK_CLANG" ]]; then
            echo "::error::NDK install completed but clang was not found: $NDK_CLANG"
            sdkmanager --sdk_root="$SDK_ROOT" --list_installed || true
            ls -la "$SDK_ROOT/ndk" || true
            exit 1
          fi
          echo "Verified NDK compiler: $NDK_CLANG"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build APK
        shell: bash
        working-directory: extracted/TEIN
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          echo "Gradle SDK path: $(sed -n 's/^sdk.dir=//p' local.properties)"
          gradle --no-daemon :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TEIN-apk
          path: extracted/TEIN/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
