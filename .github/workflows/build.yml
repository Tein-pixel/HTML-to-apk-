name: Build & Auto Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and extract TEIN.zip
        run: |
          if [ ! -f "TEIN.zip" ]; then
            echo "::error::TEIN.zip tidak ditemukan di root repository. Upload TEIN.zip lalu jalankan workflow lagi."
            exit 1
          fi
          rm -rf extracted
          mkdir -p extracted
          unzip -q TEIN.zip -d extracted
          if [ ! -f "extracted/TEIN/settings.gradle" ]; then
            echo "::error::Struktur ZIP tidak sesuai. File extracted/TEIN/settings.gradle tidak ditemukan."
            find extracted -maxdepth 3 -type f | head -80
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 15859902

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK
        run: |
          cd extracted/TEIN
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release
          cp extracted/TEIN/app/build/outputs/apk/debug/app-debug.apk release/TEIN.apk
          test -s release/TEIN.apk

      - name: Generate release version
        id: version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TEIN ${{ steps.version.outputs.tag }}
          body: |
            ## TEIN APK

            APK dibangun otomatis menggunakan GitHub Actions.

            - Build: #${{ github.run_number }}
            - Commit: `${{ github.sha }}`
          files: release/TEIN.apk
          generate_release_notes: true
